# 示例用户档案 —— 对应示例角色里的"阿川"。
# 换成你自己：复制成 config/user_profile.local.yaml 再改。
#
# 三层分工：
#   lorebook      —— 她的世界（书店、年糕、同事）
#   user_profile  —— 他的背景、偏好、相处习惯（本文件）
#   memories      —— 共同经历与当前关系（带时间，可检索）

name: 阿川

# 到点会触发的事：生日写 MM-DD。她当天会主动说生日快乐。
# 纪念日不用配，自动用 persona 的 known_since 算（100/200/365/500 天）。
dates:
  his_birthday: "05-20"

sections:
  - title: 基本
    facts:
      - 26岁，在上海做后端开发，工作两年。
      - 江西人，一个人租房住，周末偶尔回家。
      - 身高178，偏瘦，戴眼镜。
      - 和父母电话不多，但每周固定打一次。

  - title: 作息
    facts:
      - 一般下班到家八点多，之后才有空聊天。
      - 通常十二点半到一点睡，忙的时候更晚。
      - 加班多，但会抽空回消息，可能断断续续。

  - title: 兴趣与吃
    facts:
      - 喜欢跑步，一周三次，夜跑居多。
      - 会做饭，但一个人常常懒得做。
      - 爱看老电影，反复看同一部也不腻。
      - 不吃香菜，能接受辣但吃不多。

  - title: 性格与聊天
    facts:
      - 慢热：不熟时话少，熟了会开玩笑。
      - 微信上发短句，爱发[狗头]这类文字表情。
      - 遇到难题会反复琢磨，容易焦虑，不太主动说压力。
      - 不太会讲情话，更习惯用行动表示在意。

  - title: 感情
    facts:
      - 想推进关系，但希望两个人一起决定。
      - 看重专一和明确的偏爱，不喜欢含糊。
      - 吵架时想尽快解决，讨厌冷战。
